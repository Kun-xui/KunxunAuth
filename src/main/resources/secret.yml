# ==========================================================================
#  KunxunAuth 敏感凭据文件
#
#  ⚠ 这个文件不要提交到 Git、不要发群里、不要跟插件 jar 一起打包分发。
#     它只应该存在于运行服务器的插件目录里：
#         plugins/KunxunAuth/secret.yml
#
#  取值优先级（从高到低）：
#     1. 环境变量（适合 Docker / 面板部署，最安全）
#     2. 本文件
#     3. config.yml（仅兼容老配置，会打告警，请尽快迁移）
#
#  对应的环境变量名：
#     KUNXUN_MAIL_ACCOUNT      发件邮箱账号
#     KUNXUN_MAIL_PASSWORD     邮箱授权码
#     KUNXUN_MYSQL_PASSWORD    外部数据库密码
# ==========================================================================

mail:
  # 发件邮箱账号，例如 your-account@qq.com
  account: ''
  # 邮箱授权码（不是登录密码）。
  # QQ 邮箱：设置 → 账号 → POP3/SMTP 服务 → 开启后生成授权码。
  # QQ 的授权码一旦泄露，别人就能用你的邮箱发信，请务必只放在本文件里。
  password: ''

# 仅当 config.yml 的 database.type = mysql 时才需要
mysql:
  password: ''
