# Minecraft 26.2 的官方版本号（Mojang 从 26.x 起改用「年份.第几次发布」的版本方案）
minecraft_version=26.2

# Fabric Loader。0.19.5 是 fabricmc 元数据里 26.2 的最新稳定版；
# 模组本身只用到很基础的 API，0.19.3 起都能跑。
fabric_loader_version=0.19.5

fabric_api_version=0.160.0+26.2

# Loom 的版本写在 build.gradle.kts 的 plugins 块里（Gradle 的插件版本不能来自 properties 文件）。
# 用的是 1.17.20：Fabric 没有发布裸的 "1.17"，只有 1.17.1 .. 1.17.20 和 1.17-SNAPSHOT。

# 服务器插件与模组共用同一个协议版本，改协议时两边一起改
mod_version=1.0.0

org.gradle.jvmargs=-Xmx2G
org.gradle.caching=true
