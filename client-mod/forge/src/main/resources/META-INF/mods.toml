# Forge 的模组描述文件。
# 字段写法（loaderVersion 用 65 系列、依赖用 mandatory/side 而不是 type）是照着
# 26.2-65.1.3 官方 MDK 的模板来的——Forge 的 mods.toml 和 NeoForge 的
# neoforge.mods.toml 虽然长得像，但字段名并不通用。
modLoader = "javafml"
loaderVersion = "[65,)"
license = "MIT"

# 纯客户端模组：服务端上根本没有它的用武之地。
# 声明成 clientSideOnly 会让 Forge 在联机时忽略服务端的模组列表校验，
# 也就是「服务端装没装都不影响这个客户端进服」。
clientSideOnly = true

[[mods]]
modId = "kunxunauth_device"
version = "${version}"
displayName = "KunxunAuth Device"
authors = "Kunxun"
description = '''
设备免密登录的客户端一半。

持有本机 Ed25519 私钥，收到服务端在配置阶段下发的挑战后签名回传，
让服务端确认「这就是当初绑定过的那台机器」，从而跳过密码输入。

私钥保存在游戏目录下的 kunxun-device.properties，永远不离开本机。
本模组是纯客户端模组，装到服务端没有任何作用。
'''

# 依赖范围要和 Forge 版本号体系对齐：Forge 26.2 的 loader 主版本是 65
[[dependencies.kunxunauth_device]]
modId = "forge"
mandatory = true
versionRange = "[65,)"
ordering = "NONE"
side = "BOTH"

# 上界写 26.3 是故意的：26.2 的映射/协议只保证在这个区间内兼容，
# 让 Forge 在 26.3 上直接拒绝加载，好过让玩家带着一个可能崩的模组进游戏
[[dependencies.kunxunauth_device]]
modId = "minecraft"
mandatory = true
versionRange = "[26.2,26.3,)"
ordering = "NONE"
side = "BOTH"
