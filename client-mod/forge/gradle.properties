# Forge 26.2 客户端模组
minecraft_version=26.2
forge_version=65.1.3
mod_version=1.1.0

# ForgeGradle 的补丁/重映射流程比较吃内存，给足堆
org.gradle.jvmargs=-Xmx3G
org.gradle.caching=true

# 官方 MDK 模板里带的开关：把 Minecraft 的 source set 合并进主 source set。
# 少了它，把 ../common/src/main/java 挂到 main 上这种做法在 ForgeGradle 7 里会被绕开。
net.minecraftforge.gradle.merge-source-sets=true
